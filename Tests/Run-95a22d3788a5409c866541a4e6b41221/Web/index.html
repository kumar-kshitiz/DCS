<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remote File Management</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap');
:root{--ink:#16232b;--muted:#6b7a80;--paper:#f4f1e9;--panel:#fffdf8;--teal:#087e8b;--orange:#f26b38;--line:#dfe1d8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#d8eee9 0,transparent 35%),var(--paper);color:var(--ink);font:15px 'DM Sans',sans-serif}button,input,textarea{font:inherit}button{border:0;background:var(--teal);color:#fff;padding:11px 16px;border-radius:5px;cursor:pointer;font-weight:700}button.secondary{background:#e7ece8;color:var(--ink)}button.danger{background:#c94e3d}.hidden{display:none!important}.shell{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font:700 27px 'Space Grotesk';letter-spacing:0}.brand span{color:var(--orange)}.eyebrow{color:var(--teal);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}.layout{display:grid;grid-template-columns:210px 1fr;gap:22px}.side,.content,.login{background:rgba(255,253,248,.92);border:1px solid var(--line);box-shadow:0 12px 35px #17343b12}.side{padding:16px;height:max-content}.side button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);margin:3px 0}.side button.active,.side button:hover{background:#e2f0ed;color:var(--teal)}.content{padding:24px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:18px}.path{font:700 18px 'Space Grotesk';margin-right:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 9px;border-bottom:1px solid var(--line)}.table th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.8px}.item{cursor:pointer}.item:hover{background:#f3f5ee}.kind{color:var(--teal);font-weight:700}.notice{padding:12px;background:#fff3dd;margin:12px 0;border-left:4px solid var(--orange)}.login{max-width:440px;margin:11vh auto;padding:34px}.login h1{font:700 35px 'Space Grotesk';margin:8px 0 25px}label{display:block;font-weight:700;margin:14px 0 6px}input,textarea{width:100%;border:1px solid #cbd4ce;padding:11px;border-radius:4px;background:#fff}textarea{min-height:220px;resize:vertical}.modal{position:fixed;inset:0;background:#16232b88;display:grid;place-items:center;padding:20px}.modal>div{background:var(--panel);padding:25px;width:min(620px,100%)}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:17px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#e8f1ed;padding:14px 18px}.stat b{display:block;font:700 22px 'Space Grotesk'}@media(max-width:700px){.shell{padding:16px}.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto}.side button{min-width:125px}.content{padding:15px}.table th:nth-child(3),.table td:nth-child(3){display:none}}
</style></head>
<body>
<section id="login" class="login"><div class="eyebrow">Private file workspace</div><h1>Remote files,<br><span style="color:var(--orange)">without the terminal.</span></h1><label>Username</label><input id="username" value="alice"><label>Password</label><input id="password" type="password" value="alice123"><button style="width:100%;margin-top:20px" onclick="login()">Open workspace</button><button class="secondary" style="width:100%;margin-top:10px" onclick="registerUser()">Register</button><div id="loginMsg" class="notice hidden"></div></section>
<main id="app" class="shell hidden"><header class="top"><div><div class="eyebrow">Remote file management</div><div class="brand">field<span>/</span>files</div></div><div><span id="who"></span> <button class="secondary" onclick="logout()">Log out</button></div></header><div class="layout"><nav class="side"><button class="active" onclick="showFiles(this)">Files</button><button onclick="showSearch(this)">Search</button><button onclick="showInfo(this)">Server status</button><button onclick="showLogs(this)">Activity logs</button><button onclick="changePassword()">Change password</button></nav><section class="content"><div id="view"></div></section></div></main>
<div id="modal" class="modal hidden"><div id="modalBody"></div></div>
<script>
let current='',files=[],directories=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const joinPath=(a,b)=>a?a+'/'+b:b;
function date(v){let m=/\/Date\((\d+)/.exec(String(v));return new Date(m?Number(m[1]):v).toLocaleString();}
async function api(url,opt={}){let r=await fetch(url,opt),d=await r.json();d.message=d.message||d.Message;if(!r.ok||d.success===false||d.Success===false)throw Error(d.message||'Request failed');return d;}
const post=(url,data)=>api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
window.addEventListener('unhandledrejection',e=>{e.preventDefault();alert(e.reason.message||e.reason);});
async function login(){try{let d=await post('/api/login',{username:$('username').value,password:$('password').value});current='';$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=d.displayName;await showFiles(document.querySelector('.side button'));}catch(e){$('loginMsg').textContent=e.message;$('loginMsg').classList.remove('hidden');}}
async function registerUser(){let d=await post('/api/register',{username:$('username').value,password:$('password').value,displayName:prompt('Display name')||$('username').value});alert(d.message);}
async function logout(){await api('/api/logout');location.reload();}
function activate(btn){document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');}
async function showFiles(btn){activate(btn);await loadFiles();}
async function loadFiles(){let d=await api('/api/list?path='+encodeURIComponent(current));files=d.files;directories=d.directories;
$('view').innerHTML='<div class="toolbar">'+(current?'<button class="secondary" onclick="up()">Up</button>':'')+'<div class="path">'+esc(current||'/')+'</div><button onclick="newFolder()">Folder</button><button onclick="newText()">Text file</button><button onclick="upload()">Upload file</button><button class="secondary" onclick="archive()">Compress / Extract</button></div><table class="table"><thead><tr><th>Name</th><th>Type</th><th>Modified</th><th></th></tr></thead><tbody>'+
directories.map((x,i)=>'<tr><td class="kind item" onclick="openDir('+i+')">'+esc(x.Name)+'</td><td>Folder</td><td>'+date(x.LastModifiedTime)+'</td><td><button class="danger" onclick="deleteDir('+i+')">Delete</button></td></tr>').join('')+
files.map((x,i)=>'<tr><td>'+esc(x.Name)+'</td><td>'+esc(x.Extension||'File')+'</td><td>'+date(x.LastModifiedTime)+'</td><td><button class="secondary" onclick="fileMenu('+i+')">Manage</button></td></tr>').join('')+'</tbody></table>';}
function openDir(i){current=directories[i].RelativePath;loadFiles();}
function up(){let p=current.split('/').filter(Boolean);p.pop();current=p.join('/');loadFiles();}
async function newFolder(){let n=prompt('Folder name');if(n){alert((await post('/api/create-directory',{path:joinPath(current,n)})).message);await loadFiles();}}
function upload(){let input=document.createElement('input');input.type='file';input.onchange=async()=>{let f=input.files[0];if(!f)return;let content=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(f);});alert((await post('/api/upload',{name:joinPath(current,f.name),content})).message);await loadFiles();};input.click();}
let selected='';
function fileMenu(i){let f=files[i];selected=f.RelativePath;openModal('<h2>'+esc(f.Name)+'</h2><p>'+f.Size.toLocaleString()+' bytes</p><div class="actions"><button onclick="download(selected)">Download</button><button class="secondary" onclick="edit(selected)">Edit text</button><button class="secondary" onclick="rename()">Rename</button><button class="secondary" onclick="copyMove(false)">Copy</button><button class="secondary" onclick="copyMove(true)">Move</button><button class="secondary" onclick="fileInfo()">Info</button><button class="secondary" onclick="hash()">Hash</button><button class="danger" onclick="remove(selected,false)">Delete</button></div>');}
function download(p){location='/api/download?path='+encodeURIComponent(p);closeModal();}
async function remove(p,directory){if(confirm('Delete this item?')){alert((await post('/api/delete',{path:p,directory})).message);closeModal();await loadFiles();}}
function deleteDir(i){remove(directories[i].RelativePath,true);}
async function rename(){let name=prompt('New file name',selected.split('/').pop());if(name){alert((await post('/api/rename',{path:selected,name})).message);closeModal();await loadFiles();}}
async function copyMove(move){let destination=prompt('Destination path');if(destination){alert((await post(move?'/api/move':'/api/copy',{source:selected,destination})).message);closeModal();await loadFiles();}}
async function fileInfo(){let d=await api('/api/file-info?path='+encodeURIComponent(selected));if(!d.info)throw Error('File information unavailable.');let x=d.info;alert(x.Name+'\n'+x.Size+' bytes\nCreated: '+date(x.CreationTime)+'\nModified: '+date(x.LastModifiedTime));}
async function hash(){let d=await api('/api/hash?path='+encodeURIComponent(selected));if(!d.hash)throw Error('Hash unavailable.');alert(d.hash);}
async function edit(p){selected=p;let d=await api('/api/text?path='+encodeURIComponent(p));textEditor(d.content);}
function textEditor(content){openModal('<h2>Edit '+esc(selected)+'</h2><textarea id="text">'+esc(content)+'</textarea><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button onclick="saveText(false)">Save</button><button class="secondary" onclick="saveText(true)">Append</button></div>');}
function newText(){let n=prompt('Text file name');if(n){selected=joinPath(current,n);textEditor('');}}
async function saveText(append){alert((await post('/api/text?path='+encodeURIComponent(selected),{content:$('text').value,append})).message);closeModal();await loadFiles();}
async function archive(){let action=prompt('Operation: compress or extract');if(!action)return;if(!['compress','extract'].includes(action))throw Error('Choose compress or extract.');let source=prompt(action==='compress'?'Source file or directory path (empty for root)':'Archive path');if(source===null)return;let destination=prompt(action==='compress'?'Destination ZIP path':'Destination directory path');if(destination===null)return;alert((await post('/api/'+action,{source,destination})).message);await loadFiles();}
async function showSearch(btn){activate(btn);$('view').innerHTML='<div class="toolbar"><div class="path">Search files</div><input id="pattern" placeholder="*.txt" style="max-width:260px"><button onclick="search()">Search</button></div><div id="results"></div>';}
let searchResults=[];
async function search(){let d=await api('/api/search?pattern='+encodeURIComponent($('pattern').value||'*'));searchResults=d.files;$('results').innerHTML='<table class="table">'+searchResults.map((x,i)=>'<tr><td>'+esc(x.Name)+'</td><td>'+esc(x.RelativePath)+'</td><td><button class="secondary" onclick="download(searchResults['+i+'].RelativePath)">Download</button></td></tr>').join('')+'</table>';}
async function showInfo(btn){activate(btn);let d=await api('/api/server-info'),x=d.info;if(!x)throw Error('Server information unavailable.');$('view').innerHTML='<div class="path">Server status</div><div class="stats"><div class="stat"><b>'+x.RegisteredUserCount+'</b> registered users</div><div class="stat"><b>'+x.ActiveClientCount+'</b> active clients</div><div class="stat"><b>'+(x.AvailableStorageBytes/1073741824).toFixed(1)+' GB</b> available</div></div>';}
async function showLogs(btn){activate(btn);let d=await api('/api/logs');$('view').innerHTML='<div class="path">Activity logs</div><table class="table"><thead><tr><th>Time</th><th>Action</th><th>Target</th><th>Status</th></tr></thead><tbody>'+d.logs.map(x=>'<tr><td>'+date(x.Timestamp)+'</td><td>'+esc(x.Operation)+'</td><td>'+esc(x.Target)+'</td><td>'+esc(x.Status)+'</td></tr>').join('')+'</tbody></table>';}
async function changePassword(){openModal('<h2>Change password</h2><label>Current password</label><input id="oldPassword" type="password"><label>New password</label><input id="newPassword" type="password"><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button onclick="savePassword()">Save</button></div>');}
async function savePassword(){alert((await post('/api/change-password',{oldPassword:$('oldPassword').value,newPassword:$('newPassword').value})).message);closeModal();}
function openModal(html){$('modalBody').innerHTML=html;$('modal').classList.remove('hidden');}
function closeModal(){$('modal').classList.add('hidden');}
$('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};
</script></body></html>
